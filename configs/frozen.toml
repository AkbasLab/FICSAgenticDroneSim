# The freeze (AUV-16 17.4): every file that decides how the drones fly, how the model is asked, and how a run is
# scored, with its SHA-256, fixed after the pilots and before the main experiment. Written by scripts/freeze.py,
# checked by tests/test_freeze.py on every run of the suite (and in CI): a frozen file that differs from the latest
# version fails the suite. A change that must be made goes in only with a new, dated version:
#
#     python scripts/freeze.py --note "what changed and why"
#
# Scope: agentic_uav/, configs/ (not configs/experiments/), docs/METRICS.md, docs/CONDITIONS.md, docs/EXCLUSIONS.md,
# scripts/factorial_checks.py. Digests are of the file with LF line endings. See agentic_uav/experiments/freeze.py.

[[version]]
number = 1
date = "2026-11-08"
note = "The freeze after the pilots (AUV-16 17.4). Phase 17's pilots (phase17-pilot-20261106-201311, C and D on the live 70B; phase17-pilot-d2-20261107-195223, D re-flown) found three defects in their timelines, each fixed with tests that fail on the old code and every run of record reproduced: D's start_search searched from where the drone was, across a silent teammate's keep-out, and a drone sent home after stand-by landed into a loop (4de38b1); a silent teammate over its own pad kept a keep-out over its neighbour's home (45c03d7). From here the prompts and tools, the task rules, the guardian, the network and failure profiles, the scenarios, the model manifest and the metrics are fixed for Phase 18's held-out seeds."

