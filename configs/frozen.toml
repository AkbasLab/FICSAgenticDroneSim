[[version]]
number = 5
date = "2026-11-09"
note = "The checker moved out of the package, before any D run: scripts/factorial_checks.py (was agentic_uav/experiments/factorial_exit.py), frozen by name in freeze.py's scope. Every run's manifest records the package digest and X4 holds runs to it, so a fix to a checker inside the package set aside every run already flown (A, B, C's 720 flown at 50f445d, flown again). And the faults compared as planned -- the failure file's digest -- not as they took hold: in A with severe links Drone1 can be landed before its 60 s stop, which then takes hold of nothing (found in the held-out A, B, C runs). Nothing that flies or scores changed."

