note = "The checker, fixed by the dry run on development seeds before any held-out run: a partition fault (no drone; its groups and end) could not be compared and crashed the check; and a fault is compared as planned, its taking hold held to within 1 s of the plan -- A's central controller stops Drone1 at 60.1 s for 60 s, its own clock's next step. Nothing that flies or scores changed."

