date = "2026-11-10"
note = "docs/EXCLUSIONS.md version 2 and its check: an interrupted batch's excess requests are recorded in interruptions.json beside its runs and verified by scripts/factorial_checks.py (every stray and failed request inside a declared interval; records + declared excess = the log exactly) -- for the D pair batch, stopped at 68/80 by a misplaced Ctrl+C on 2026-11-09 and resumed. The report names the EXCLUSIONS version it applies (2). No criterion, rule or run changed; the checker is outside the package, so no run's digest changed."

