# Phase 10's network factor, level 1 of 4: NOMINAL.
#
# Fixed on 2026-11-04, before any run (AUV-10, 10.2). Levels of an experimental
# factor, not claims about any radio; calibrated later by pilots (AUV-16).
# Every run records the manifest it used. Range is unlimited between drones in
# all four levels, so the condition is the only thing that varies; the base
# link keeps the scenario's own range.
#
# Nominal is the network Phases 7-9 flew: a fixed 0.1 s, nothing lost.
about = "Low latency, no intentional loss, no partition"

[latency]
mean_s = 0.1
jitter_s = 0.0
floor_s = 0.05
